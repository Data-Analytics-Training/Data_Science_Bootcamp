[project]
name = "Data_Science_Bootcamp"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Onur DOKER", email = "odoker@msn.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "tensorflow>=2.22.0rc0",
]

[project.scripts]
data-science-bootcamp = "data_science_bootcamp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
